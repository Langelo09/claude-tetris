<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <label class="theme-switch">
    <span aria-hidden="true">🌙</span>
    <input type="checkbox" id="theme-toggle" role="switch" aria-label="Modo claro" />
    <span class="switch-track"></span>
    <span aria-hidden="true">☀️</span>
  </label>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <div class="touch-controls" role="group" aria-label="Controles táctiles">
    <button type="button" data-action="left" aria-label="Mover a la izquierda">←</button>
    <button type="button" data-action="rotate" aria-label="Rotar">↻</button>
    <button type="button" data-action="right" aria-label="Mover a la derecha">→</button>
    <button type="button" data-action="down" aria-label="Bajar">↓</button>
    <button type="button" data-action="drop" aria-label="Caída rápida">⤓</button>
    <button type="button" data-action="pause" aria-label="Pausa">⏸</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
